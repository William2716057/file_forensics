<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>File Analysis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Hex Dump Viewer</h1>
    <input type="file" id="fileInput" />
    <div id="meta"></div>

    <div class="table-wrap">
        <table id="hexTable" style="display: none;">
            <thead>
                <tr>
                    <th>Offset</th>
                    <th>00</th>
                    <th>01</th>
                    <th>02</th>
                    <th>03</th>
                    <th>04</th>
                    <th>05</th>
                    <th>06</th>
                    <th>07</th>
                    <th>08</th>
                    <th>09</th>
                    <th>0A</th>
                    <th>0B</th>
                    <th>0C</th>
                    <th>0D</th>
                    <th>0E</th>
                    <th>0F</th>
                    <th>ASCII</th>
                </tr>
            </thead>
            <tbody id="hexBody"></tbody>
        </table>
        <div id="placeholder">Choose a file to see its hex dump here.</div>
    </div>


    <script src="script.js"></script>

</body>
</html>
